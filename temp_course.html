<style>body {
  background: #121f3d;
  color: #8da2c0;
  font-family: 'Roboto', sans-serif;
  padding: 1rem 0 0 0;
}

figure {
  margin: 0;
}

.Maintance {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-box-pack: justify;
  -ms-flex-pack: justify;
  justify-content: space-between;
  align-items: center;
  height: 75vh;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  max-width: 1000px;
  margin: 0 auto;
  padding: 1rem;
}

.Maintance-logo {
  width: 100px;
}

.Maintance-rocket {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

.Maintance-rocket>img {
  width: 100%;
  object-fit: contain;
}

.Maintance-logo>img {
  width: 100%;
}

h1 {
  font-size: 1.5rem;
  max-width: 368px;
  margin: 1rem 0 1.5rem 0;
  color: white;
  line-height: 1.5;
  font-weight: bold;
}

p {
  font-size: 1rem;
  margin: 0;
  margin-bottom: 2rem;
  font-weight: normal;
}

a {
  color: #33b1ff;
  text-decoration: none;
}

.error {
  font-size: 1.5rem;
}

.action {
  border-radius: 8px;
  padding: 8px 45px;
  border-top: 1px solid #33b1ff;
  border-right: 1px solid #33b1ff;
  border-bottom: 1px solid #33b1ff;
  border-left: 1px solid #33b1ff;
  font-weight: bold;
}

.separator {
  height: 1px;
  width: 100%;
  background-color: #24385b;
  margin-bottom: 1.5rem;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 1rem;
}

.links a {
  margin: 0 0.75rem;
  color: #becde3;
}

@media (min-width: 680px) {

  body,
  .Maintance {
    height: 90vh;
  }

  .Maintance-rocket {
    margin: 0 auto;
  }
}

@media (max-width: 680px) {
  .Maintance {
    flex-direction: column;
  }

  .Maintance-logo {
    margin: 0 auto;
  }

  .links {
    display: none;
  }
}</style>
