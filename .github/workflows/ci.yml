name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: npm run lint
      - run: node --test tests/*.test.js
      - run: npm run build:extension
      - run: node scripts/write-sha256.mjs dist/upse-extension.zip
      - run: npm run check:package
      - name: Install Playwright Chromium for isolated browser E2E
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser export E2E
        run: npm run test:browser-export
      - uses: actions/upload-artifact@v4
        with:
          name: upse-extension-${{ github.sha }}
          path: |
            dist/upse-extension.zip
            dist/upse-extension.zip.sha256
